        body, html, * {

        body, html {

        .noise {
            position: fixed;

            z-index: 9999;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .cursor-dot {
            width: 8px;
            height: 8px;
            background-color: #111111;
            border-radius: 50%;
            position: fixed;
            top: 0; left: 0;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999999;
            transition: width 0.3s, height 0.3s, background-color 0.3s;
        }
        
        .cursor-outline {
            width: 48px;
            height: 48px;
            border: 1px solid rgba(17, 17, 17, 0.2);
            border-radius: 50%;
            position: fixed;
            top: 0; left: 0;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999998;
            transition: width 0.3s, height 0.3s, border-color 0.3s, background-color 0.3s;
            transition-timing-function: ease-out;
        }

        /* Marquee Animation */
        .marquee-container {

            white-space: nowrap;
            position: relative;

        .marquee-content {

        @keyframes marquee {

        .reveal-inner {

        .is-revealed .reveal-inner {

        }

        .text-outline {

        }

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function useCustomCursor() {
            const dotRef = useRef(null);
            const outlineRef = useRef(null);

            useEffect(() => {
                const moveCursor = (e) => {
                    if (dotRef.current) {
                        dotRef.current.style.left = `${e.clientX}px`;
                        dotRef.current.style.top = `${e.clientY}px`;
                    }
                    if (outlineRef.current) {
                        setTimeout(() => {
                            if (outlineRef.current) {
                                outlineRef.current.style.left = `${e.clientX}px`;
                                outlineRef.current.style.top = `${e.clientY}px`;
                            }
                        }, 50);
                    }
                };

                const handleMouseOver = (e) => {
                    const target = e.target.closest('a, button, input, textarea, .hover-target');
                    if (target && dotRef.current && outlineRef.current) {
                        dotRef.current.style.transform = 'translate(-50%, -50%) scale(0.5)';
                        outlineRef.current.style.transform = 'translate(-50%, -50%) scale(1.5)';
                        outlineRef.current.style.borderColor = '#2563EB';
                        outlineRef.current.style.backgroundColor = 'rgba(37,99,235,0.05)';
                    }
                };

                const handleMouseOut = () => {
                    if (dotRef.current && outlineRef.current) {
                        dotRef.current.style.transform = 'translate(-50%, -50%) scale(1)';
                        outlineRef.current.style.transform = 'translate(-50%, -50%) scale(1)';
                        outlineRef.current.style.borderColor = 'rgba(17,17,17,0.2)';
                        outlineRef.current.style.backgroundColor = 'transparent';
                    }
                };

                window.addEventListener('mousemove', moveCursor);
                document.addEventListener('mouseover', handleMouseOver);
                document.addEventListener('mouseout', handleMouseOut);

                return () => {
                    window.removeEventListener('mousemove', moveCursor);
                    document.removeEventListener('mouseover', handleMouseOver);
                    document.removeEventListener('mouseout', handleMouseOut);
                };
            }, []);

            return { dotRef, outlineRef };
        }

        function ScrollReveal({ children, className = "", delay = 0 }) {
            const ref = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => {
                            setIsVisible(true);
                        }, delay);
                        observer.disconnect();
                    }
                }, { threshold: 0.1 });
                
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [delay]);

            return (
                <div ref={ref} className={`${className} ${isVisible ? 'is-revealed' : ''}`}>
                    {children}
                </div>
            );
        }
